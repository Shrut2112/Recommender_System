<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Books</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar {
            background-color: #FBB13C;
        }
        .navbar-brand{
            color: #ffffff;
            font-weight: 800;
        } 
        .nav-link {
            color: #ffffff !important;
        }
        .title{
            color: #ffffff;
            padding-left: 100px;
        }
        h4{
          font-size: medium;  
        }
        body{
            background: #262525;
        }
        .card {
        height: 350px; /* Set a fixed height for the card */
        text-align: center;
    }
    .card-img-top {
        height: 200px; /* Fixed height for the image */
        object-fit: cover; /* Ensure the image fits well without distortion */
    }
    .card img{
        height: 200px;
        width:fit-content;
        object-fit: cover;
    }
    .card-title, .card-text {
        white-space: nowrap; /* Prevent text wrapping */
        overflow: hidden; /* Hide overflowing text */
        text-overflow: ellipsis; /* Add ellipsis for overflowing text */
    }
    .info{
        padding-top: 25px;
    }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Book World</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/recommend">Recommend</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Help</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h4 class="text-white fs-2">Recommend Books</h4>
        <div class="input-group" style="display: flex; flex-direction: column;">
        <form action="/recommend_books" method="POST">
            <input name="user_input" type="text" class="form-control" placeholder="Search Here...."><br>
            <input type="submit" class="btn btn-md btn-warning">
        </form>
        </div>
    </div>
    <div class="row" style="margin-left: 180px;margin-top: 0px;">
    {% if data %}
    {% for i in data %}
                <div class="col-md-2" style="margin-top: 20px;">
                    <div class="card">
                        <div class="card-body">
                            <img class="card-img-top" src="{{ i[2] }}">
                            <div class="info">
                                <h4 class="text-black">{{ i[0] }}</h4>
                                <p style="font-size: small;">Author: {{ i[1] }}</p>
                            </div>
                        </div>
                    </div>
                </div>
    {% endfor %}
    {% endif %}
</div>
      <!-- Bootstrap JS and Icons -->
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>

</body>
</html>
